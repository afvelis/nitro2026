<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cortesías Nitro2026</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  @page { size: letter portrait; margin: 0.5in; }
  body { margin:0; font-family:Arial,sans-serif; background:#e5e7eb; }
  .bar { position:sticky; top:0; background:#111; color:#fff; padding:10px;
         display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:14px; }
  .bar button, .bar select { padding:6px 12px; border-radius:6px; border:0;
         background:#333; color:#fff; cursor:pointer; font-size:14px; }
  .bar button.p { background:#16a34a; font-weight:700; }
  .bar button:disabled { opacity:.4; cursor:not-allowed; }
  #info { min-width:120px; text-align:center; }
  #pages { padding:20px 0; }
  .page { width:7.5in; height:9.8in; background:#fff; margin:0 auto;
          display:none; gap:0.08in; box-shadow:0 2px 12px rgba(0,0,0,.2); }
  .page.on { display:grid; }
  .cell { display:flex; flex-direction:column; align-items:center;
          justify-content:center; padding:2px; overflow:hidden; }
  .cell svg { width:var(--qr) !important; height:var(--qr) !important;
              display:block; shape-rendering:crispEdges; }
  .lbl { font-size:8pt; font-weight:700; margin-top:4px; white-space:nowrap; }
  #ov { position:fixed; inset:0; background:rgba(0,0,0,.9); color:#fff;
        display:none; align-items:center; justify-content:center; font-size:18px; z-index:99; }
  #ov.on { display:flex; }
  @media print {
    .bar, #ov { display:none !important; }
    #pages { padding:0; }
    .page { display:grid !important; margin:0 !important; box-shadow:none !important;
            page-break-after:always; }
    .page:last-child { page-break-after:auto; }
  }
</style>
</head>
<body>

<div class="bar">
  <strong>Cortesías Nitro2026</strong>
  <label>Diseño:
    <select id="lay">
      <option value="3x5" selected>3×5 — 15/hoja</option>
      <option value="4x6">4×6 — 24/hoja</option>
    </select>
  </label>
  <button id="prev">◀</button>
  <span id="info">Página 1 / 30</span>
  <button id="next">▶</button>
  <button id="prep">⚡ Preparar todo</button>
  <button class="p" id="pdf">🖨️ Guardar PDF</button>
</div>

<div id="pages"></div>
<div id="ov">Generando…</div>

<script>
var TOTAL=450, PREFIX='Cortesía Nitro2026';
var cols=3, rows=5, per=15, totalPages=30, cur=0, busy=false;
var cache=new Array(TOTAL+1), done=[];
var pagesEl=document.getElementById('pages'),
    info=document.getElementById('info'),
    prev=document.getElementById('prev'),
    next=document.getElementById('next'),
    prep=document.getElementById('prep'),
    pdfBtn=document.getElementById('pdf'),
    lay=document.getElementById('lay'),
    ov=document.getElementById('ov');

function pad(n){ n=String(n); while(n.length<3) n='0'+n; return n; }

function qrSVG(n){
  if(cache[n]) return cache[n];
  var qr=qrcode(0,'L');
  qr.addData(PREFIX+pad(n));
  qr.make();
  cache[n]=qr.createSvgTag(4,2);
  return cache[n];
}

function sizes(){
  var cw=(7.5-(cols-1)*0.08)/cols, ch=(9.8-(rows-1)*0.08)/rows;
  var s=Math.min(cw,ch)*0.72;
  document.documentElement.style.setProperty('--qr',s.toFixed(3)+'in');
}

function build(){
  var f=document.createDocumentFragment();
  done=new Array(totalPages).fill(false);
  sizes();
  for(var p=0;p<totalPages;p++){
    var pg=document.createElement('div');
    pg.className='page';
    pg.style.gridTemplateColumns='repeat('+cols+',1fr)';
    pg.style.gridTemplateRows='repeat('+rows+',1fr)';
    for(var i=0;i<per;i++){
      var n=p*per+i+1;
      if(n>TOTAL){ pg.appendChild(document.createElement('div')); continue; }
      var c=document.createElement('div');
      c.className='cell'; c.dataset.n=n;
      var lbl=document.createElement('div');
      lbl.className='lbl'; lbl.textContent=PREFIX+pad(n);
      c.appendChild(lbl);
      pg.appendChild(c);
    }
    f.appendChild(pg);
  }
  pagesEl.innerHTML='';
  pagesEl.appendChild(f);
}

function fill(p){
  if(done[p]) return;
  var cells=pagesEl.children[p].querySelectorAll('.cell');
  for(var i=0;i<cells.length;i++){
    var n=+cells[i].dataset.n;
    if(!n) continue;
    cells[i].insertAdjacentHTML('afterbegin', qrSVG(n));
  }
  done[p]=true;
}

function goTo(p){
  if(busy||p<0||p>=totalPages) return;
  cur=p;
  var all=pagesEl.children;
  for(var i=0;i<all.length;i++) all[i].classList.toggle('on', i===cur);
  fill(cur);
  info.textContent='Página '+(cur+1)+' / '+totalPages;
  prev.disabled = cur===0;
  next.disabled = cur===totalPages-1;
  if(cur+1<totalPages) setTimeout(function(){ fill(cur+1); },80);
}

prev.onclick=function(){ goTo(cur-1); };
next.onclick=function(){ goTo(cur+1); };

prep.onclick=function(){
  if(busy) return; busy=true; ov.classList.add('on');
  var t0=performance.now();
  var i=0;
  function step(){
    if(i>=totalPages){
      ov.classList.remove('on'); busy=false;
      prep.textContent='✓ '+Math.round(performance.now()-t0)+' ms';
      setTimeout(function(){ prep.textContent='⚡ Preparar todo'; },2000);
      return;
    }
    ov.textContent='Generando hoja '+(i+1)+' / '+totalPages+'…';
    fill(i);
    i++;
    setTimeout(step,0);
  }
  step();
};

pdfBtn.onclick=function(){
  if(busy) return; busy=true; ov.classList.add('on');
  var i=0;
  function step(){
    if(i>=totalPages){
      ov.classList.remove('on'); busy=false;
      setTimeout(function(){ window.print(); },100);
      return;
    }
    ov.textContent='Preparando PDF… '+(i+1)+' / '+totalPages;
    fill(i);
    i++;
    setTimeout(step,0);
  }
  step();
};

lay.onchange=function(){
  var v=lay.value.split('x');
  cols=+v[0]; rows=+v[1]; per=cols*rows;
  totalPages=Math.ceil(TOTAL/per);
  build(); cur=0; goTo(0);
};

(function init(){
  var v=lay.value.split('x');
  cols=+v[0]; rows=+v[1]; per=cols*rows;
  totalPages=Math.ceil(TOTAL/per);
  build(); goTo(0);
})();
</script>
</body>
</html>
