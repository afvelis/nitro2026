<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte Publicidad - Septiembre</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body {
    background: #f4f5f7;
    min-height: 100vh;
    padding: 30px 20px;
    color: #333;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: white;
    border-radius: 8px;
    padding: 40px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  h1 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 8px;
    font-size: 26px;
    font-weight: 600;
  }
  .subtitle {
    text-align: center;
    color: #7f8c8d;
    margin-bottom: 35px;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 15px;
    margin-bottom: 35px;
  }
  .stat-card {
    background: #fafbfc;
    padding: 18px 20px;
    border-radius: 6px;
    text-align: center;
    border: 1px solid #e8e8e8;
  }
  .stat-card .label { font-size: 11px; color: #7f8c8d; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .value { font-size: 22px; font-weight: 600; color: #2c3e50; margin-top: 6px; }
  .stat-card.highlight { background: #2c3e50; border-color: #2c3e50; }
  .stat-card.highlight .label, .stat-card.highlight .value { color: white; }
  .chart-container {
    position: relative;
    height: 450px;
    margin-bottom: 20px;
  }
  .legend-custom {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 15px;
    font-size: 12px;
    color: #555;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .color-box { width: 14px; height: 14px; border-radius: 3px; }
  .footer {
    text-align: center;
    color: #95a5a6;
    font-size: 11px;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #eee;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Gasto en Publicidad</h1>
    <p class="subtitle">FACEBOOK ADS + CREADORA DE CONTENIDO · SEPTIEMBRE 2026</p>

    <div class="stats">
      <div class="stat-card">
        <div class="label">Total Ads</div>
        <div class="value">$177.86</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Creadora</div>
        <div class="value">$300.00</div>
      </div>
      <div class="stat-card highlight">
        <div class="label">Costo Total</div>
        <div class="value">$477.86</div>
      </div>
      <div class="stat-card">
        <div class="label">Días activos</div>
        <div class="value">10</div>
      </div>
    </div>

    <div class="legend-custom">
      <div class="legend-item"><div class="color-box" style="background:#37474f;"></div> Publicidad (Ads)</div>
      <div class="legend-item"><div class="color-box" style="background:#5c8a8a;"></div> Creadora de contenido</div>
    </div>

    <div class="chart-container">
      <canvas id="chart"></canvas>
    </div>

    <div class="footer">
     Informe resultados Nitrotoon 2026
    </div>
  </div>

<script>
  const ctx = document.getElementById('chart').getContext('2d');
  
  const adData = [6.00, 30.08, 9.91, 16.00, 8.00, 12.00, 2.55, 32.32, 12.00, 49.00];
  const totalAds = 177.86;
  const creatorTotal = 300.00;
  const creatorData = adData.map(ad => (ad / totalAds) * creatorTotal);

  new Chart(ctx, {
    type: 'bar',
    plugins: [ChartDataLabels], // Aquí "enchufamos" el accesorio de las etiquetas
    data: {
      labels: [
        'Vie 04 sept', 'Sáb 05 sept', 'Dom 06 sept', 'Lun 07 sept', 'Mar 08 sept',
        'Mié 09 sept', 'Jue 10 sept', 'Vie 11 sept', 'Sáb 12 sept', 'Lun 14 sept'
      ],
      datasets: [
        {
          label: 'Publicidad (Ads)',
          data: adData,
          backgroundColor: '#37474f',
          borderRadius: 4,
          borderSkipped: false,
          barPercentage: 0.7
        },
        {
          label: 'Creadora de contenido',
          data: creatorData.map(v => parseFloat(v.toFixed(2))),
          backgroundColor: '#5c8a8a',
          borderRadius: 4,
          borderSkipped: false,
          barPercentage: 0.7
        }
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          stacked: true,
          beginAtZero: true,
          ticks: {
            callback: v => '$' + v,
            color: '#7f8c8d',
            font: { size: 11 }
          },
          grid: { color: '#f0f0f0' },
          title: { display: true, text: 'Costo (USD)', color: '#7f8c8d', font: { size: 12 } }
        },
        y: {
          stacked: true,
          ticks: { color: '#2c3e50', font: { size: 12, weight: '500' } },
          grid: { display: false }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#2c3e50',
          padding: 10,
          cornerRadius: 4,
          callbacks: {
            label: ctx => ' ' + ctx.dataset.label + ': $' + ctx.raw.toFixed(2)
          }
        },
        datalabels: {
          color: '#ffffff',
          font: { size: 10, weight: 'bold' },
          formatter: function(value) {
            return '$' + value.toFixed(2);
          },
          anchor: 'center',
          align: 'center',
          clamp: true
        }
      }
    }
  });
</script>
</body>
</html>
